name: roaming-feed

# Waarom dit hier draait en niet in Cloudflare: Odido, Ben en KPN weren
# datacenter-IP's. Precies hetzelfde probleem als bij de MediaMarkt-feed.
# Een GitHub-runner heeft een schoon IP en komt er wel door.

on:
  schedule:
    - cron: '20 4 * * *'      # elke nacht 04:20 UTC
  workflow_dispatch:           # en met de hand vanuit het Actions-tabblad

permissions:
  contents: write

concurrency:
  group: roaming-feed
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # De browser wordt gecachet: de download is ruim 100 MB en kostte elke
      # run anderhalve minuut. Na de eerste keer komt hij uit de cache.
      - name: Browser uit de cache halen
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.49.1

      # --with-deps is weggelaten: ubuntu-latest heeft die bibliotheken al,
      # en die apt-stap kostte in z'n eentje bijna een minuut.
      - name: Playwright installeren
        continue-on-error: true
        run: |
          npm install playwright@1.49.1 --no-save --no-fund --no-audit
          npx playwright install chromium

      - name: Controleren of de bestanden er zijn
        run: |
          test -f scrape-roaming.mjs || { echo "::error::scrape-roaming.mjs ontbreekt in de repo"; exit 1; }
          echo "scrape-roaming.mjs gevonden ($(wc -c < scrape-roaming.mjs) bytes)"

      - name: Providers ophalen
        id: scrape
        # pipefail is essentieel: zonder dat telt alleen de exitcode van tee,
        # en die slaagt altijd. Een crashende scraper gaf dan een groen vinkje
        # met een lege samenvatting.
        shell: bash
        run: |
          set -o pipefail
          node scrape-roaming.mjs 2>&1 | tee scrape.log

      - name: Samenvatting in de run zetten
        if: always()
        run: |
          {
            echo '## Roaming-feed'
            echo ''
            echo '```'
            cat scrape.log 2>/dev/null || echo 'geen log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wijzigingen vastleggen
        run: |
          if git diff --quiet -- roaming.json; then
            echo "Niets veranderd, geen commit."
            exit 0
          fi
          git config user.name  "roaming-bot"
          git config user.email "actions@github.com"
          git add roaming.json
          git commit -m "roaming: dekking bijgewerkt $(date -u +%Y-%m-%d)"
          git push

      # Verandert er iets bij een provider, dan wil je dat weten in plaats van
      # het over drie maanden per ongeluk te ontdekken.
      - name: Melden bij wijziging
        if: success()
        run: |
          GEWIJZIGD=$(node -e "
            try {
              const d = require('./roaming.json');
              const g = (d.samenvatting && d.samenvatting.gewijzigd) || [];
              process.stdout.write(g.join(', '));
            } catch (e) {}
          ")
          if [ -n "$GEWIJZIGD" ]; then
            echo "::warning title=Roamingdekking gewijzigd::$GEWIJZIGD — controleer of de tabel nog klopt"
            echo "**Gewijzigd:** $GEWIJZIGD" >> "$GITHUB_STEP_SUMMARY"
          fi
